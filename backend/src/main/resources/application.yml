spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/heritagesage
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

# AI provider: groq | huggingface | openai
ai:
  provider: ${AI_PROVIDER:groq}
  # Groq — fast inference for open-source models (default)
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  # HuggingFace serverless inference (OpenAI-compatible endpoint)
  huggingface:
    api-key: ${HUGGINGFACE_API_KEY:}
    model: ${HUGGINGFACE_MODEL:meta-llama/Llama-3.2-3B-Instruct}
  # OpenAI (fallback / legacy)
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini

# Eval service
eval:
  service:
    url: ${EVAL_SERVICE_URL:http://localhost:8001/evaluate-image}
